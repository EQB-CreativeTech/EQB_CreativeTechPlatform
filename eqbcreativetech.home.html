<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EQB Creative Tech</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="home">

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
        <div class="container">

            <a class="navbar-brand fw-bold fs-3 text-primary" href="./eqbcreativetech.home.html">
                EQB <span>Creative Tech</span>
            </a>

            <button class="navbar-toggler" type="button" aria-label="Toggle navigation" data-bs-toggle="collapse"
                data-bs-target="#navbarContent">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarContent">

                <ul id="navLinks" class="navbar-nav mx-auto"></ul>

                <div class="d-flex gap-2">

                    <button class="btn btn-outline-primary" type="button" data-auth-open="login">
                        Login
                    </button>

                    <button class="btn btn-primary" type="button" data-auth-open="register">
                        Register
                    </button>

                </div>

            </div>

        </div>
    </nav>

    <!-- ================= HERO SECTION ================= -->

    <section class="hero-section">

        <div class="container">

            <div id="homeHero" class="row align-items-center g-5"></div>

        </div>

    </section>

    <!-- ================= DOMAIN SECTION ================= -->

    <section id="domains" class="domains-section py-5">

        <div class="container">

            <div id="domainsSectionHeader" class="text-center mb-5"></div>

            <div id="domainGrid" class="domain-grid"></div>

        </div>

    </section>

    <!-- ================= STATS SECTION ================= -->

    <section class="stats-section py-5">

        <div class="container">

            <div id="statsGrid" class="stats-wrapper"></div>

        </div>

    </section>

    <!-- ================= HOW IT WORKS ================= -->

    <section id="how-it-works" class="how-section py-5">

        <div class="container">

            <div id="howItWorksSectionHeader" class="text-center mb-5"></div>

            <div id="stepsGrid" class="steps-grid"></div>

        </div>

    </section>

    <!-- ================= CONTACT SECTION ================= -->

    <section id="contact" class="contact-section py-5">

        <div class="container">

            <div class="contact-section-inner">

                <aside id="contactAside" class="contact-aside" aria-label="About EQB Creative Tech"></aside>

                <div class="contact-card">

                    <div id="contactCardHeader"></div>

                    <form id="contactForm" novalidate>

                        <div class="mb-3">
                            <label class="form-label" for="contactName">Full name</label>
                            <input id="contactName" name="name" type="text" class="form-control custom-input" placeholder="Enter your full name" minlength="3" maxlength="60" required autocomplete="name" data-required-message="Enter your name." data-minlength-message="Name must be at least 3 characters.">
                            <div class="invalid-feedback">Enter your name (at least 3 characters).</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="contactEmail">Email address</label>
                            <input id="contactEmail" name="email" type="email" class="form-control custom-input" placeholder="name@example.com" required autocomplete="email" data-required-message="Enter your email address." data-email-message="Enter a valid email address.">
                            <div class="invalid-feedback">Enter a valid email address.</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="contactSubject">Subject</label>
                            <input id="contactSubject" name="subject" type="text" class="form-control custom-input" placeholder="How can we help?" minlength="3" maxlength="80" required data-required-message="Enter a subject." data-minlength-message="Subject must be at least 3 characters.">
                            <div class="invalid-feedback">Enter a subject of at least 3 characters.</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="contactMessage">Message</label>
                            <textarea id="contactMessage" name="message" rows="5" class="form-control custom-input" placeholder="Write your message" minlength="10" maxlength="1000" required data-required-message="Enter your message." data-minlength-message="Message must be at least 10 characters."></textarea>
                            <div class="invalid-feedback">Enter a message of at least 10 characters.</div>
                        </div>

                        <button id="contactSubmit" class="btn btn-primary w-100 py-3" type="submit">
                            Send Message
                        </button>

                        <p id="contactStatus" class="form-status mt-3 mb-0" role="status" aria-live="polite"></p>

                    </form>

                </div>

            </div>

        </div>

    </section>

    <!-- ================= NEWSLETTER ================= -->

    <section class="newsletter-section">

        <div class="container">

            <div class="newsletter-box">

                <div id="newsletterHeader"></div>

                <form id="newsletterForm" class="newsletter-form" novalidate>

                    <label class="visually-hidden" for="newsletterEmail">Email address</label>

                    <input id="newsletterEmail" name="email" type="email" placeholder="Enter your email"
                        class="newsletter-input" autocomplete="email" required
                        data-required-message="Enter your email address.">

                    <button class="newsletter-submit" type="submit">
                        Subscribe
                        <i class="bi bi-send-fill" aria-hidden="true"></i>
                    </button>

                </form>

                <p id="newsletterStatus" class="newsletter-status" role="status" aria-live="polite"></p>

            </div>

        </div>

    </section>

    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <div class="container">

            <div class="footer-grid">

                <!-- Company -->

                <div>

                    <h3 class="footer-logo">
                        EQB
                    </h3>

                    <p id="footerAbout"></p>

                </div>

                <!-- Quick Links -->

                <div>

                    <h5>Quick Links</h5>

                    <ul id="footerQuickLinks" class="footer-links"></ul>

                </div>

                <!-- Resources -->

                <div>

                    <h5>Resources</h5>

                    <ul id="footerResourceLinks" class="footer-links"></ul>

                </div>

                <!-- Contact -->

                <div>

                    <h5>Contact</h5>

                    <ul id="footerContactInfo" class="footer-links"></ul>

                </div>

            </div>

            <hr>

            <div class="footer-bottom">

                <p id="footerCopyright"></p>

                <div id="socialIcons" class="social-icons"></div>

            </div>

        </div>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/config.local.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/forms.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/content-loader.js"></script>
    <script src="js/content.js"></script>
    <script src="js/chrome.js"></script>
    <script src="js/chatbot.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/script.js"></script>

</body>

</html>
